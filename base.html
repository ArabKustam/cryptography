<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tools — Стеганография, Спектрограмма, Морзянка, QR</title>
    <meta name="description"
        content="Криптографические инструменты: скрытие текста в изображениях, создание спектрограмм, азбука Морзе и QR-коды">
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modules/morse.css">
    <link rel="stylesheet" href="css/modules/qrcode.css">
    <link rel="stylesheet" href="css/modules/editor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    Crypto
                </h1>
                <p class="tagline">Cryptography Toolkit</p>
            </div>
            <nav class="nav-menu">
            <a href="index.html" class="nav-item" data-tab="stegano">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></svg></span>
                <span class="nav-text">Стеганография</span>
            </a>
            <a href="spectro.html" class="nav-item" data-tab="spectro">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg></span>
                <span class="nav-text">Спектрограмма</span>
            </a>
            <a href="morse.html" class="nav-item" data-tab="morse">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" /><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" /><circle cx="12" cy="12" r="2" /><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" /><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" /></svg></span>
                <span class="nav-text">Морзянка</span>
            </a>
            <a href="qrcode.html" class="nav-item" data-tab="qrcode">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="3" height="3" /><rect x="18" y="14" width="3" height="3" /><rect x="14" y="18" width="3" height="3" /><rect x="18" y="18" width="3" height="3" /></svg></span>
                <span class="nav-text">QR-код</span>
            </a>
            <a href="base.html" class="nav-item active" data-tab="base">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
                <span class="nav-text">Base</span>
            </a>
            <a href="ciphers.html" class="nav-item" data-tab="ciphers">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
                <span class="nav-text">Шифры</span>
            </a>
            <a href="editor.html" class="nav-item" data-tab="editor">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
                <span class="nav-text">Редактор</span>
            </a>
                        <a href="metadata.html" class="nav-item" data-tab="metadata">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></span>
                <span class="nav-text">Метаданные</span>
            </a>
</nav>
        </aside>
        <main class="main-content">
            <section class="panel active" id="base">
            <div class="panel-header">
                <h2>
                    <span class="header-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                        </svg>
                    </span>
                    Base Кодировки
                </h2>
                <p>Base64, Base32, Base16 (Hex) для текста и файлов</p>
            </div>

            <div class="mode-switch">
                <button class="mode-btn active" data-base-mode="encode"><span>Закодировать</span></button>
                <button class="mode-btn" data-base-mode="decode"><span>Декодировать</span></button>
            </div>

            <div class="base-content">
                <div class="base-settings" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="setting-group" style="flex: 1;">
                        <label>Алгоритм</label>
                        <select id="base-algorithm">
                            <option value="base64" selected>Base64</option>
                            <option value="base32">Base32</option>
                            <option value="base16">Base16 (Hex)</option>
                            <option value="base2">Двоичный код (Binary)</option>
                        </select>
                    </div>
                    <div class="setting-group" style="flex: 1;">
                        <label>Тип данных</label>
                        <select id="base-datatype">
                            <option value="text" selected>Текст</option>
                            <option value="file">Файл / Изображение</option>
                        </select>
                    </div>
                </div>

                <!-- Text Input -->
                <div id="base-text-input-group">
                    <textarea id="base-input-text" placeholder="Введите текст..."></textarea>
                </div>

                <!-- File Input -->
                <div id="base-file-input-group" style="display: none;">
                    <div class="drop-zone" id="base-file-drop">
                        <div class="drop-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                        </div>
                        <p>Перетащи файл или <span class="browse">выбери файл</span></p>
                        <input type="file" id="base-file-input" hidden>
                    </div>
                    <div id="base-file-preview" style="display: none; align-items: center; justify-content: space-between; padding: 1rem; border: 1px solid var(--border-color); border-radius: var(--radius-sm); margin-bottom: 1rem;">
                        <span id="base-file-name" style="word-break: break-all; color: var(--text-primary);">Имя файла</span>
                        <button class="action-btn small" id="base-file-clear" style="background: var(--error); width: auto;">Очистить</button>
                    </div>
                </div>

                <button class="action-btn" id="base-action-btn">
                    <span class="btn-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    <span id="base-action-text">Закодировать</span>
                </button>

                <div class="result-section" id="base-result" style="display: none; margin-top: 1.5rem;">
                    <h3>Результат:</h3>
                    
                    <div id="base-result-text-group">
                        <textarea id="base-output-text" readonly style="margin-bottom: 0.5rem;"></textarea>
                        <button class="action-btn small" id="base-copy-btn">
                            <span class="btn-icon">
                                <svg viewBox="0 0 24 24">
                                    <rect x="9" y="9" width="13" height="13" rx="2" />
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                                </svg>
                            </span>
                            Копировать
                        </button>
                    </div>
                    
                    <div id="base-result-file-group" style="display: none;">
                        <div class="preview-container" id="base-image-preview" style="display: none; margin-bottom: 1rem;">
                            <img id="base-output-image" src="" alt="Decoded Image" style="max-width: 100%; border-radius: var(--radius-md);">
                        </div>
                        <button class="download-btn" id="base-download-btn">
                            <span class="btn-icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                    <polyline points="7 10 12 15 17 10" />
                                    <line x1="12" y1="15" x2="12" y2="3" />
                                </svg>
                            </span>
                            Скачать файл
                        </button>
                    </div>
                </div>
            </div>
        </section>
        </main>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Modular JS -->
    <script src="js/utils.js"></script>
    <script src="js/modules/stegano.js"></script>
    <script src="js/modules/spectro.js"></script>
    <script src="js/modules/morse.js"></script>
    <script src="js/modules/qrcode.js"></script>
    <script src="js/modules/base.js"></script>
    <script src="js/modules/editor.js"></script>
    <script src="js/modules/ciphers.js"></script>
    <script src="js/modules/metadata.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

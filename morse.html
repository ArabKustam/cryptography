<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Tools — Стеганография, Спектрограмма, Морзянка, QR</title>
    <meta name="description"
        content="Криптографические инструменты: скрытие текста в изображениях, создание спектрограмм, азбука Морзе и QR-коды">
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modules/morse.css">
    <link rel="stylesheet" href="css/modules/qrcode.css">
    <link rel="stylesheet" href="css/modules/editor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">
                    <span class="icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </span>
                    Crypto
                </h1>
                <p class="tagline">Cryptography Toolkit</p>
            </div>
            <nav class="nav-menu">
            <a href="index.html" class="nav-item" data-tab="stegano">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="m21 15-5-5L5 21" /></svg></span>
                <span class="nav-text">Стеганография</span>
            </a>
            <a href="spectro.html" class="nav-item" data-tab="spectro">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg></span>
                <span class="nav-text">Спектрограмма</span>
            </a>
            <a href="morse.html" class="nav-item active" data-tab="morse">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" /><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" /><circle cx="12" cy="12" r="2" /><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" /><path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" /></svg></span>
                <span class="nav-text">Морзянка</span>
            </a>
            <a href="qrcode.html" class="nav-item" data-tab="qrcode">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" /><rect x="14" y="3" width="7" height="7" /><rect x="3" y="14" width="7" height="7" /><rect x="14" y="14" width="3" height="3" /><rect x="18" y="14" width="3" height="3" /><rect x="14" y="18" width="3" height="3" /><rect x="18" y="18" width="3" height="3" /></svg></span>
                <span class="nav-text">QR-код</span>
            </a>
            <a href="base.html" class="nav-item" data-tab="base">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
                <span class="nav-text">Base</span>
            </a>
            <a href="ciphers.html" class="nav-item" data-tab="ciphers">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></span>
                <span class="nav-text">Шифры</span>
            </a>
            <a href="editor.html" class="nav-item" data-tab="editor">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
                <span class="nav-text">Редактор</span>
            </a>
                        <a href="metadata.html" class="nav-item" data-tab="metadata">
                <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg></span>
                <span class="nav-text">Метаданные</span>
            </a>
</nav>
        </aside>
        <main class="main-content">
            <section class="panel active" id="morse">
            <div class="panel-header">
                <h2>
                    <span class="header-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" />
                            <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" />
                            <circle cx="12" cy="12" r="2" />
                            <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" />
                            <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" />
                        </svg>
                    </span>
                    Азбука Морзе
                </h2>
                <p>Кодирование, декодирование и распознавание</p>
            </div>

            <div class="morse-tabs">
                <button class="morse-tab active" data-morse="text-to-morse">Текст → Морзе</button>
                <button class="morse-tab" data-morse="morse-to-text">Морзе → Текст</button>
                <button class="morse-tab" data-morse="audio-decode">Аудио → Текст</button>
            </div>

            <div class="morse-content">
                <!-- Текст → Морзе -->
                <div class="morse-panel active" id="text-to-morse">
                    <textarea id="text-input"
                        placeholder="Введи текст для конвертации в морзянку (только латиница A-Z, 0-9)..."></textarea>
                    <button class="action-btn" id="to-morse-btn">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" />
                                <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" />
                                <circle cx="12" cy="12" r="2" />
                                <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" />
                                <path d="M19.1 4.9C23 8.8 23 15.1 19.1 19" />
                            </svg>
                        </span>
                        Конвертировать
                    </button>
                    <div class="result-box" id="morse-output-box" style="display: none;">
                        <h4>Морзянка:</h4>
                        <p id="morse-output" class="morse-text"></p>
                        <div class="morse-visualizer" id="morse-visualizer-container">
                            <div class="visualizer-controls">
                                <button class="ctrl-btn" id="morse-zoom-out" title="Уменьшить">−</button>
                                <input type="range" id="morse-zoom" min="1" max="10" value="1" step="0.5">
                                <button class="ctrl-btn" id="morse-zoom-in" title="Увеличить">+</button>
                                <span class="zoom-label" id="morse-zoom-label">100%</span>
                            </div>
                            <div class="canvas-wrapper" id="morse-canvas-wrapper">
                                <canvas id="morse-canvas"></canvas>
                            </div>
                            <div class="pan-controls">
                                <button class="ctrl-btn" id="morse-pan-left" title="Влево">◀</button>
                                <input type="range" id="morse-pan" min="0" max="100" value="0">
                                <button class="ctrl-btn" id="morse-pan-right" title="Вправо">▶</button>
                            </div>
                        </div>
                        <div class="play-controls">
                            <button class="play-btn" id="play-morse">
                                <span class="btn-icon">
                                    <svg viewBox="0 0 24 24">
                                        <polygon points="5 3 19 12 5 21 5 3" />
                                    </svg>
                                </span>
                                Воспроизвести
                            </button>
                            <button class="play-btn stop-btn" id="stop-morse" style="display: none;">
                                <span class="btn-icon">
                                    <svg viewBox="0 0 24 24">
                                        <rect x="6" y="4" width="4" height="16" />
                                        <rect x="14" y="4" width="4" height="16" />
                                    </svg>
                                </span>
                                Стоп
                            </button>
                            <button class="play-btn download-morse-btn" id="download-morse-audio">
                                <span class="btn-icon">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                        <polyline points="7 10 12 15 17 10" />
                                        <line x1="12" y1="15" x2="12" y2="3" />
                                    </svg>
                                </span>
                                Скачать WAV
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Морзе → Текст -->
                <div class="morse-panel" id="morse-to-text">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                        <textarea id="morse-input" 
                            placeholder="Введи морзянку (. и -, буквы через пробел, слова через /)..." 
                            style="margin-bottom: 0;"></textarea>
                        <div class="lang-selector" style="display: flex; flex-direction: column; gap: 0.5rem; margin-left: 1rem;">
                            <label style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Язык:</label>
                            <div class="btn-group" style="display: flex; background: var(--bg-primary); border-radius: var(--radius-sm); border: 1px solid var(--border-color); padding: 2px;">
                                <button class="small-btn active" id="morse-lang-ru" style="padding: 4px 8px; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s;">RU</button>
                                <button class="small-btn" id="morse-lang-en" style="padding: 4px 8px; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s;">EN</button>
                            </div>
                        </div>
                    </div>
                    <button class="action-btn" id="from-morse-btn">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                            </svg>
                        </span>
                        Декодировать
                    </button>
                    <div class="result-box" id="text-output-box" style="display: none;">
                        <h4>Текст:</h4>
                        <p id="text-output"></p>
                    </div>
                </div>

                <!-- Аудио → Текст -->
                <div class="morse-panel" id="audio-decode">
                    <div class="drop-zone" id="morse-audio-drop">
                        <div class="drop-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                                <line x1="12" y1="19" x2="12" y2="22" />
                            </svg>
                        </div>
                        <p>Перетащи аудио файл или <span class="browse">выбери файл</span></p>
                        <input type="file" id="morse-audio-input" accept="audio/*" hidden>
                    </div>
                    <div class="audio-preview" id="morse-audio-preview" style="display: none;">
                        <audio id="morse-audio-player" controls></audio>
                        <button class="clear-btn" id="morse-audio-clear">
                            <svg viewBox="0 0 24 24">
                                <line x1="18" y1="6" x2="6" y2="18" />
                                <line x1="6" y1="6" x2="18" y2="18" />
                            </svg>
                        </button>
                    </div>
                    <button class="action-btn" id="decode-audio-btn">
                        <span class="btn-icon">
                            <svg viewBox="0 0 24 24">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.3-4.3" />
                            </svg>
                        </span>
                        Распознать морзянку
                    </button>
                    <div class="result-box" id="audio-result-box" style="display: none;">
                        <h4>Визуализация сигнала:</h4>
                        <div class="morse-waveform" id="morse-waveform-container">
                            <div class="visualizer-controls">
                                <button class="ctrl-btn" id="waveform-zoom-out" title="Уменьшить">−</button>
                                <input type="range" id="waveform-zoom" min="1" max="10" value="1" step="0.5">
                                <button class="ctrl-btn" id="waveform-zoom-in" title="Увеличить">+</button>
                                <span class="zoom-label" id="waveform-zoom-label">100%</span>
                            </div>
                            <div class="canvas-wrapper" id="waveform-canvas-wrapper">
                                <canvas id="morse-waveform-canvas"></canvas>
                            </div>
                            <div class="pan-controls">
                                <button class="ctrl-btn" id="waveform-pan-left" title="Влево">◀</button>
                                <input type="range" id="waveform-pan" min="0" max="100" value="0">
                                <button class="ctrl-btn" id="waveform-pan-right" title="Вправо">▶</button>
                            </div>
                        </div>
                        <h4>Распознано:</h4>
                        <p id="audio-morse-output" class="morse-text"></p>
                        <p id="audio-text-output"></p>
                    </div>
                </div>
            </div>

            <div class="morse-reference">
                <h4>Справочник:</h4>
                <div class="morse-table" id="morse-table"></div>
            </div>
        </section>
        </main>
    </div>

    <!-- Libraries -->
    <script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Modular JS -->
    <script src="js/utils.js"></script>
    <script src="js/modules/stegano.js"></script>
    <script src="js/modules/spectro.js"></script>
    <script src="js/modules/morse.js"></script>
    <script src="js/modules/qrcode.js"></script>
    <script src="js/modules/base.js"></script>
    <script src="js/modules/editor.js"></script>
    <script src="js/modules/ciphers.js"></script>
    <script src="js/modules/metadata.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
